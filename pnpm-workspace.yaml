# pnpm settings (pnpm 12 no longer reads the "pnpm" field in package.json).
# Overrides pin transitive dependencies to patched versions (OSV scanner findings).
packages:
  - '.'

# Settings formerly in .npmrc (pnpm >= 11 reads only auth/registry keys from .npmrc).
engineStrict: true
saveExact: true

overrides:
  'tar': '>=7.5.19'
  'tmp': '>=0.2.4'
  'lodash': '>=4.18.0'
  'postcss': '>=8.5.23'
  'qs': '>=6.16.1'
  'uuid': '>=11.1.1'
  'brace-expansion': '>=1.1.18'
  'esbuild': '>=0.28.1'
  'fast-uri': '>=4.2.3'
  'form-data': '>=4.0.6'
  'js-yaml': '>=3.15.0'
  'undici': '>=8.12.2'
  'katex': '>=0.18.2'
  'launch-editor': '>=2.14.2'
  'markdown-it@^14': '>=14.3.3 <15'
  'smol-toml': '>=1.9.0'
  'body-parser': '>=2.4.0'
  're2js': '>=2.8.7'
  'zod': '>=4.6.6'

# Build scripts are denied by default (strictDepBuilds). Rule on each explicitly.
allowBuilds:
  esbuild: false
  unrs-resolver: false
