# Gitleaks configuration file
# For full configuration options, see: https://github.com/gitleaks/gitleaks
#
# Runs locally via `pnpm scan:secrets` (scripts/scan-secrets.sh) and in CI via
# the `secrets` job in .github/workflows/reusable-security.yml (pinned release).
# Add a new allowlist entry only with a comment saying why it is not a secret.

title = "Gitleaks Config for agentic-nextjs-ts-starter"

[extend]
# Use the default gitleaks rules
useDefault = true

# Global allowlists (v8.25+ syntax). A finding is ignored if ANY block matches.
# Within one block the conditions (paths, regexes, ...) are ANDed, so keep
# unrelated exemptions in separate blocks.

[[allowlists]]
description = "Example and fixture files that document dummy credentials"
paths = [
  '''\.env\.example$''',
  '''\.env\.template$''',
  '''/test/fixtures/''',
  '''/tests/fixtures/''',
]

[[allowlists]]
description = "Next.js build output committed by mistake in 6692cd7e and removed since (now gitignored); the flagged values are per-build random preview-mode and server-action keys from a local dev build, regenerated on every `next build`"
paths = [
  '''(^|/)\.next/''',
]

[[allowlists]]
description = "Placeholder tokens used in deleted docs/tests examples (docs/LOGGING_OUTPUT.md, tests/config.spec.ts) that still exist in history"
# regexTarget defaults to the detected secret itself
regexes = [
  '''^sk-abc123xyz$''',
  '''^sk-1234567890abcdef$''',
  '''^test-api-key-12345$''',
  '''^dummy-secret$''',
]
