# =============================================================================
# REUSABLE WORKFLOW: Code Validation Suite
# PURPOSE: Run the project's quality gates in parallel jobs
# USAGE: Called by PR and main workflows for consistent validation
# OUTPUTS: Coverage reports when requested
#
# SINGLE SOURCE OF TRUTH: the gate list lives in package.json. `pnpm precommit`
# runs it serially (audit → check:static → check:deps → test:coverage →
# changeset:status); the jobs below run the same named scripts in parallel:
#   test          → pnpm test:coverage
#   lint          → pnpm check:static (+ changeset:status on PRs)
#   code-quality  → pnpm check:deps, then build + size (needs the build output)
# `pnpm audit` runs in reusable-security.yml. Add a new gate to one of the
# check:* scripts, never to this file alone, so hook, docs and CI stay aligned.
# =============================================================================

name: Reusable Validate

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version (should match package.json engines.node)'
        type: string
        default: '26' # UPDATE: When upgrading Node.js
      pnpm-version:
        description: 'pnpm version (should match package.json packageManager)'
        type: string
        default: '12.16.1' # UPDATE: When upgrading pnpm
      validate-changesets:
        description: 'validate that a changeset exists on the branch'
        type: boolean
        default: false

# EXAMPLE USAGE:
# jobs:
#   validate:
#     uses: ./.github/workflows/reusable-validate.yml
#     with:
#       upload-coverage: true  # For PRs to show coverage

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history for accurate analysis

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm # Cache dependencies for speed

      - name: Install dependencies
        # Ensures exact versions from lock file
        # FAILS IF: Lock file out of sync with package.json
        run: pnpm install --frozen-lockfile

      - name: Tests with coverage
        # Run test suite with coverage
        # Coverage enforces 90% minimum threshold for all metrics
        # FAILS IF: Tests fail or coverage below 90% (when coverage enabled)
        # To debug: Check test output and coverage/index.html
        run: pnpm test:coverage

      - name: Upload coverage
        # Make coverage reports available for review
        # Download from Actions tab to view detailed HTML report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          retention-days: 7 # Keep for a week for PR reviews

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history for accurate analysis

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm # Cache dependencies for speed

      - name: Install dependencies
        # Ensures exact versions from lock file
        # FAILS IF: Lock file out of sync with package.json
        run: pnpm install --frozen-lockfile

      # =============================================================================
      # VALIDATION CHECKS
      # All checks run in sequence to provide clear failure messages
      # =============================================================================

      - name: Install actionlint
        # Pinned release binary with SHA-256 verification (no curl | bash from
        # a moving branch). UPDATE: bump both the version and the checksum
        # together; checksums are published alongside each release at
        # https://github.com/rhysd/actionlint/releases
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "/tmp/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  /tmp/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar -xzf "/tmp/${archive}" -C "${RUNNER_TEMP}/actionlint" actionlint
          echo "${RUNNER_TEMP}/actionlint" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/actionlint/actionlint" -version

      - name: Static checks
        # Same list as `pnpm precommit`: format, spelling, YAML, Markdown and
        # workflow linting, version-drift check, typecheck and ESLint.
        # FAILS IF: Any of those gates fails
        # To fix: 'pnpm format:fix', 'pnpm lint:fix', 'pnpm lint:markdown:fix';
        #         run 'pnpm check:static' locally to reproduce
        run: pnpm check:static

      - name: Fetch main branch for changesets
        if: inputs.validate-changesets
        # Need main branch to compare changesets
        run: git fetch origin main:main

      - name: Changeset status
        if: inputs.validate-changesets
        # Validates that changesets exist for features/fixes
        # FAILS IF: feat/fix commits exist without changesets
        # To fix: Run 'pnpm changeset' and commit the generated file
        # For non-code changes: Run 'pnpm changeset --empty'
        run: pnpm changeset:status

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency and structure checks
        # Same list as `pnpm precommit`: circular dependencies (madge),
        # architectural rules (dependency-cruiser), duplication in app/ and
        # tests/ (jscpd) and dead code (Knip).
        # FAILS IF: Any of those gates fails
        # To debug: Run 'pnpm check:deps' locally
        run: pnpm check:deps

      - name: Build application
        run: pnpm build

      - name: Check bundle size
        run: pnpm size

      - name: Generate full metrics report
        if: always()
        run: |
          mkdir -p reports
          pnpm deps:summary > reports/deps-summary.txt || true

      - name: Upload metrics reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: code-quality-reports-${{ github.sha }}
          path: reports/
          retention-days: 7
